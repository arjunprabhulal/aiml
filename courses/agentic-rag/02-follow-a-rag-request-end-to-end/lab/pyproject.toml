[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiml-agentic-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["langchain-core==1.7.0", "langchain-ollama==1.1.0", "langchain-text-splitters==1.1.3", "numpy==2.5.4"]

[tool.setuptools.packages.find]
where = ["src"]
