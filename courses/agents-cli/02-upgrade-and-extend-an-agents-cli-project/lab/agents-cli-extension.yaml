schema: agents-cli-extension/v1alpha1
requires:
  agents_cli: ">=1.10,<2.0"
commands:
  override:
    deploy:
      description: Run unit tests before deploying docuctl-docs
      run:
        - uv
        - run
        - pytest
        - tests/unit
  add:
    release-check:
      description: Run lint and unit tests for release readiness
      run:
        - uv
        - run
        - pytest
        - tests/unit
        - -v
